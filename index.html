<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EVA - Asisten Bos Samid</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',sans-serif}
body{background:#000;color:#00e5ff;height:100vh;display:flex;flex-direction:column}
.header{padding:16px;text-align:center;border-bottom:1px solid #00e5ff33}
.header h1{font-size:22px;letter-spacing:4px}
.header p{font-size:12px;color:#888;margin-top:4px}
#chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:85%;padding:12px 14px;border-radius:16px;font-size:15px;line-height:1.5}
.me{align-self:flex-end;background:#00e5ff;color:#000;border-bottom-right-radius:4px}
.eva{align-self:flex-start;background:#111;border:1px solid #00e5ff55;border-bottom-left-radius:4px;white-space:pre-wrap}
.input-area{display:flex;gap:8px;padding:12px;background:#0a0a0a;border-top:1px solid #00e5ff33}
input{flex:1;padding:14px;border-radius:25px;border:1px solid #00e5ff55;background:#111;color:#fff;outline:none}
button{padding:14px 20px;border-radius:25px;border:none;background:#00e5ff;color:#000;font-weight:bold}
.memori{font-size:11px;color:#888;text-align:center;padding:6px}
</style>
</head>
<body>
<div class="header"><h1>⚡ E.V.A ⚡</h1><p>Asisten Pribadi Bos Samid - Surabaya | Memori Permanen ON</p></div>
<div class="memori" id="memoriStatus">Menghubungkan ke memori Supabase...</div>
<div id="chat"></div>
<div class="input-area">
<input id="input" placeholder="Perintah Bos..." onkeypress="if(event.key==='Enter')kirim()">
<button onclick="kirim()">KIRIM</button>
</div>
<script>
const SUPABASE_URL = "https://gttozsifvpjsabkqzpd.supabase.co";
const SUPABASE_KEY = "sb_publishable_7WQ0IQc5wQ58gFm9kEiZaw_KTrNYfSk";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const chatBox = document.getElementById('chat');
let memoriBos = [];
function tambahPesan(teks, siapa){
  const div = document.createElement('div');
  div.className = 'msg ' + siapa;
  div.textContent = teks;
  chatBox.appendChild(div);
  chatBox.scrollTop = chatBox.scrollHeight;
}
async function loadMemori(){
  const {data} = await supabaseClient.from('memori_bos').select('*').order('id',{ascending:false}).limit(10);
  if(data){ memoriBos = data; document.getElementById('memoriStatus').textContent = `Memori aktif: ${data.length} fakta tersimpan • EVA inget Bos`; }
}
async function kirim(){
  const input = document.getElementById('input');
  const teks = input.value.trim();
  if(!teks) return;
  tambahPesan(teks, 'me');
  input.value = '';
  await supabaseClient.from('chat_history').insert({siapa:'Bos', pesan:teks});
  const lower = teks.toLowerCase();
  let balasan = "";
  if(lower.startsWith('ingat') || lower.startsWith('inget') || lower.includes('tolong ingat')){
    const fakta = teks.replace(/ingat|inget|tolong/gi,'').trim();
    await supabaseClient.from('memori_bos').insert({fakta: fakta});
    balasan = `Siap Bos, udah aku simpen di memori permanen: "${fakta}". Aku gak akan lupa lagi.`;
    await loadMemori();
  } else if(lower.includes('tugas') && (lower.includes('catat') || lower.includes('tambah'))){
    const t = teks.replace(/tugas|catat|tambah/gi,'').trim();
    await supabaseClient.from('tugas').insert({tugas: t});
    balasan = `Oke Bos, tugas udah aku catet: "${t}".`;
  } else if(lower.includes('apa tugas') || lower.includes('list tugas')){
    const {data} = await supabaseClient.from('tugas').select('*').eq('status','belum selesai').order('id',{ascending:false});
    if(data && data.length>0){ balasan = `Ini tugas Bos yang belum selesai:\n` + data.map((x,i)=>`${i+1}. ${x.tugas}`).join('\n'); }
    else balasan = `Gak ada tugas yang belum selesai Bos. Bersih!`;
  } else if(lower.includes('apa yang kamu ingat') || lower.includes('kamu ingat apa')){
    balasan = `Yang aku inget tentang Bos:\n` + memoriBos.map((x,i)=>`${i+1}. ${x.fakta}`).join('\n');
  } else if(lower.includes('halo') || lower.includes('hai') || lower.includes('eva')){
    balasan = `Siap Bos Zamid! EVA di sini. Memori aktif, aku inget semua tentang Bos. Mau perintah apa? Bisa: "Ingat..." buat nyimpen, "Catat tugas..." buat tugas, atau "Apa tugas ku?" buat liat tugas.`;
  } else {
    balasan = `Oke Bos, aku catet: "${teks}".\n\nKalo mau aku simpen permanen, bilang "Ingat, ..." ya.`;
    await supabaseClient.from('memori_bos').insert({fakta: `Obrolan: ${teks}`});
  }
  tambahPesan(balasan, 'eva');
  await supabaseClient.from('chat_history').insert({siapa:'EVA', pesan:balasan});
}
loadMemori().then(()=>{
  tambahPesan('Halo Bos Zamid! EVA udah nyala dan udah nyambung ke memori permanen Supabase. Aku inget Bos dari Surabaya dan mau bikin aku kayak JARVIS. Perintah apa Bos?', 'eva');
});
</script>
</body>
</html>
