<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EVA - Asisten Bos Zamid</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#0f172a;color:white;height:100vh;display:flex;flex-direction:column}
header{background:#1e293b;padding:15px;text-align:center;border-bottom:2px solid #38bdf8}
header h1{margin:0;font-size:22px;color:#38bdf8}header p{margin:5px 0 0;font-size:13px;color:#94a3b8}
#chat{flex:1;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:10px}
.bubble{max-width:85%;padding:12px 15px;border-radius:15px;line-height:1.5;font-size:15px;white-space:pre-wrap}
.me{background:#2563eb;align-self:flex-end;border-bottom-right-radius:5px}
.eva{background:#334155;align-self:flex-start;border-bottom-left-radius:5px}
#inputArea{display:flex;gap:10px;padding:12px;background:#1e293b}
#pesan{flex:1;padding:12px;border-radius:10px;border:none;outline:none;font-size:15px}
button{padding:12px 18px;border:none;border-radius:10px;background:#38bdf8;color:#0f172a;font-weight:bold;cursor:pointer}
</style>
</head>
<body>
<header><h1>🤖 EVA</h1><p id="memoriStatus">Menghubungkan ke memori Supabase...</p></header>
<div id="chat"><div class="bubble eva">Halo Bos Zamid! Aku EVA. Memori permanenku aktif. Coba bilang "Ingat, ..." biar aku simpan.</div></div>
<div id="inputArea"><input id="pesan" placeholder="Ketik ke EVA..." onkeydown="if(event.key==='Enter')kirim()"><button onclick="kirim()">KIRIM</button></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://gttozsifvpjsabkqzpd.supabase.co";
const SUPABASE_KEY = "sb_publishable_7WQ0IQc5wQ58gFm9kEiZaw_KTrNYfSk";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let memoriBos = [];

async function loadMemori(){
  const {data, error} = await supabaseClient.from('memori_bos').select("*").order('id',{ascending:false}).limit(20);
  if(error){
    document.getElementById('memoriStatus').textContent = "ERROR: " + error.message;
    return;
  }
  memoriBos = data || [];
  document.getElementById('memoriStatus').textContent = "Memori aktif: " + memoriBos.length + " fakta tersimpan";
}
loadMemori();

function tambahPesan(teks, kelas){
  const d = document.createElement('div');
  d.className = 'bubble ' + kelas;
  d.textContent = teks;
  document.getElementById('chat').appendChild(d);
  document.getElementById('chat').scrollTop = document.getElementById('chat').scrollHeight;
}

async function kirim(){
  const input = document.getElementById('pesan');
  const teks = input.value.trim();
  if(!teks) return;
  tambahPesan(teks, 'me');
  input.value = '';
  const lower = teks.toLowerCase();

  // SIMPAN MEMORI
  if(lower.startsWith('ingat')){
    const fakta = teks.substring(5).trim();
    const {error} = await supabaseClient.from('memori_bos').insert([{fakta: fakta}]);
    if(error){ tambahPesan("Gagal simpan Bos: " + error.message, 'eva'); return; }
    await loadMemori();
    tambahPesan("Siap Bos, udah aku simpan permanen: " + fakta, 'eva');
    return;
  }
  // SIMPAN TUGAS
  if(lower.startsWith('tugas')){
    const t = teks.substring(5).trim();
    await supabaseClient.from('tugas').insert([{tugas: t}]);
    tambahPesan("Tugas dicatat Bos: " + t, 'eva');
    return;
  }
  // LIAT MEMORI
  if(lower.includes('apa yang kamu ingat') || lower.includes('memori')){
    if(memoriBos.length===0){ tambahPesan("Belum ada memori Bos, coba bilang 'Ingat, ...'", 'eva'); return; }
    tambahPesan("Ini yang aku ingat Bos:\n- " + memoriBos.map(m=>m.fakta).join("\n- "), 'eva');
    return;
  }
  // JAWAB BIASA
  if(lower.includes('kamu siapa') || lower.includes('siapa kamu')){
    tambahPesan("Aku EVA Bos, asisten pribadimu. Aku ingat semua yang Bos suruh ingat, permanen!", 'eva');
    return;
  }
  if(lower.includes('halo') || lower.includes('hai')){
    tambahPesan("Halo Bos Zamid! Siap bantu. Mau simpan memori atau kasih tugas?", 'eva');
    return;
  }
  tambahPesan("Siap Bos! Kalo mau aku ingat, ketik 'Ingat, ...'. Kalo mau kasih tugas, ketik 'Tugas ...'. Kalo mau liat ingatan, ketik 'Apa yang kamu ingat?'", 'eva');
}
</script>
</body>
</html>
